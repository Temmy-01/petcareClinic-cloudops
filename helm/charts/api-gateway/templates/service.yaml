apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: {{ .Values.global.namespace | default "petclinic" }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: management
  selector:
    {{- include "api-gateway.selectorLabels" . | nindent 4 }}
