name: CI / Build and Test

on:
  push:
    branches: [ Dev, main ]
  pull_request:
    branches: [ Dev, main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Fix mvnw line endings and make executable
      run: sed -i 's/\r$//' upstream/mvnw && chmod +x upstream/mvnw

    - name: Build with Maven
      run: |
        cd upstream
        sh ./mvnw clean install -Dmaven.test.skip=true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: 'upstream/**/target/*.jar'
        retention-days: 1

  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Trivy — scan dependencies for CVEs
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: upstream/
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH
        ignore-unfixed: true

    - name: Trivy — scan Helm charts for misconfigurations
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: config
        scan-ref: helm/
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH

    - name: Trivy — scan Terraform for misconfigurations
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: config
        scan-ref: terraform/
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH

    - name: Upload Trivy SARIF report
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        scan-ref: upstream/
        format: sarif
        output: trivy-results.sarif
        exit-code: '0'
        severity: CRITICAL,HIGH
        ignore-unfixed: true

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: trivy-results.sarif

  checkov-scan:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Checkov
      run: pip install checkov

    - name: Checkov — scan Terraform
      run: |
        checkov -d terraform/ \
          --framework terraform \
          --skip-check CKV2_K8S_6 \
          --compact \
          --soft-fail
      continue-on-error: true

    - name: Checkov — scan Helm / Kubernetes
      run: |
        checkov -d helm/ \
          --framework helm \
          --skip-check CKV2_K8S_6 \
          --compact \
          --soft-fail
      continue-on-error: true
